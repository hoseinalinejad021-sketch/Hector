name: Build Hector Debug APK (no release key required)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-debug-apk.yml"

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Publish Build Overview
        shell: bash
        run: |
          {
            echo "## Hector Build Overview"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Runner | ubuntu-latest |"
            echo "| Java distribution/version | Eclipse Temurin 17 |"
            echo "| Gradle | 8.11.1 |"
            echo "| Android SDK platform | android-36 (API 36) |"
            echo "| Android Build Tools | 36.0.0 |"
            echo "| compileSdk / targetSdk | 36 / 36 |"
            echo "| minSdk | 23 |"
            echo "| Package ID | com.hector.android |"
            echo "| Build variant | debug |"
            echo "| APK output | app/build/outputs/apk/debug/app-debug.apk |"
            echo "| Artifact name | Hector-debug-APK |"
            echo "| Artifact retention | 14 days |"
            echo
            echo "SDK packages are installed by android-actions/setup-android@v4."
            echo "This workflow creates a debug-signed APK; it is not an official release-signed build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required source files
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hector/android/MainActivity.kt

      - name: Create CI debug signing key required by project configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build debug APK (no personal release key required)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee app-debug-signer.txt
          "$aapt" dump badging "$apk" | tee app-debug-metadata.txt
          grep -Fq "package: name='com.hector.android'" app-debug-metadata.txt
          sha256sum "$apk" | tee app-debug.apk.sha256

      - name: Upload installable debug APK and verification files
        uses: actions/upload-artifact@v4
        with:
          name: Hector-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug-signer.txt
            app-debug-metadata.txt
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
