name: Build Hector Debug APK (no release key required)

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "main"
      - "@Chat-GPT"
permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate checkout credential isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for filename in (
              ".github/workflows/android.yml",
              ".github/workflows/build-debug-apk.yml",
          ):
              text = Path(filename).read_text(encoding="utf-8")
              steps = text.split("      - name: ")
              checkout_steps = [
                  step for step in steps
                  if step.splitlines() and step.splitlines()[0].strip() == "Checkout"
              ]
              if len(checkout_steps) != 1:
                  raise SystemExit(
                      f"{filename}: expected exactly one Checkout step; "
                      f"found {len(checkout_steps)}"
                  )
              step = checkout_steps[0].split("\n      - name: ", 1)[0]
              lines = step.splitlines()
              if not any(line.strip().startswith("uses: actions/checkout@") for line in lines):
                  raise SystemExit(f"{filename}: Checkout step does not use actions/checkout")
              try:
                  with_index = next(i for i, line in enumerate(lines) if line.strip() == "with:")
              except StopIteration:
                  raise SystemExit(f"{filename}: Checkout step has no with: block")
              options = []
              for line in lines[with_index + 1:]:
                  if line and not line.startswith("          "):
                      break
                  if line.strip().startswith("persist-credentials:"):
                      options.append(line.strip())
              if options != ["persist-credentials: false"]:
                  raise SystemExit(
                      f"{filename}: Checkout with: must set persist-credentials: false "
                      f"exactly once; found {options}"
                  )
              print(f"{filename}: checkout credentials are disabled in the Checkout step.")
          PY


      - name: Require and validate Firebase Android resources
        shell: bash
        env:
          HECTOR_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.HECTOR_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${HECTOR_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            if [[ "${GITHUB_ACTOR:-}" == "dependabot[bot]" ]]; then
              # Build-only Firebase config: never expose production secrets to Dependabot.
              # This lets dependency PRs compile/test; it cannot authenticate to the real project.
              cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "814329214529",
              "project_id": "hector-9b819",
              "storage_bucket": "hector-9b819.firebasestorage.app"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:814329214529:android:6fb241cfa3849de815f8c0",
                "android_client_info": {"package_name": "com.hector.android"}
              },
              "api_key": [{"current_key": "AIzaSyDUMMY_BUILD_ONLY_NOT_A_REAL_KEY"}]
            }]
          }
          JSON
              echo "::notice::Using build-only Firebase placeholder for Dependabot; no production Firebase secret was provided."
            else
              echo "::error::HECTOR_GOOGLE_SERVICES_JSON_BASE64 is missing. This build requires the real Firebase configuration outside Dependabot dependency checks."
              exit 1
            fi
          else
            printf '%s' "$HECTOR_GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/google-services.json")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Firebase google-services.json is not valid JSON: {exc}")

          project = data.get("project_info", {})
          if project.get("project_id") != "hector-9b819":
              raise SystemExit(
                  "Firebase config project_id mismatch; expected hector-9b819, "
                  f"got {project.get('project_id')!r}"
              )

          expected_app_id = "1:814329214529:android:6fb241cfa3849de815f8c0"
          matches = [
              client for client in data.get("client", [])
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.hector.android"
          ]
          if not matches:
              raise SystemExit(
                  "Firebase config does not contain Android package com.hector.android"
              )
          if not any(
              client.get("client_info", {}).get("mobilesdk_app_id") == expected_app_id
              for client in matches
          ):
              raise SystemExit(
                  "Firebase Android app ID mismatch; expected "
                  "1:814329214529:android:6fb241cfa3849de815f8c0"
              )

          print("Firebase config validated: project hector-9b819, app com.hector.android.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle from the checked-in Wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Publish Build Overview
        shell: bash
        run: |
          {
            echo "## Hector Build Overview"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Runner | ubuntu-latest |"
            echo "| Java distribution/version | Eclipse Temurin 17 |"
            echo "| Gradle | 8.13 |"
            echo "| Android SDK platform | android-36 (API 36) |"
            echo "| Android Build Tools | 36.0.0 |"
            echo "| compileSdk / targetSdk | 36 / 36 |"
            echo "| minSdk | 23 |"
            echo "| Package ID | com.hector.android |"
            echo "| Build variant | debug |"
            echo "| APK output | app/build/outputs/apk/debug/app-debug.apk |"
            echo "| Artifact name | Hector-debug-APK |"
            echo "| Artifact retention | 14 days |"
            echo
            echo "SDK packages are installed by android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd."
            echo "This workflow creates a debug-signed APK; it is not an official release-signed build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required source files
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/CloudMemorySync.kt
          test -f app/src/main/java/com/hector/android/CloudSyncPayloadLimits.kt
          test -f app/src/main/java/com/hector/android/LiveVoiceActivity.kt
          test -f app/src/test/java/com/hector/android/CloudSyncPayloadLimitsTest.kt
          test -f app/src/main/java/com/hector/android/HectorFirebaseMessagingService.kt
          grep -q 'registerCurrentPushTokenForSignedInUser' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'request.auth.uid == userId' firestore.rules
          grep -q 'request.resource.data.installationId' firestore.rules
          grep -q 'firebase_messaging_installation_id_enabled' app/src/main/AndroidManifest.xml
          grep -q 'FirebaseMessaging.getInstance().token' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'override fun onNewToken(token: String)' app/src/main/java/com/hector/android/HectorFirebaseMessagingService.kt
          grep -q 'FirebaseInstallations.getInstance().id' app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/AgentTaskPolicy.kt
          test -f app/src/main/java/com/hector/android/AgentTaskVerifier.kt
          test -f app/src/main/java/com/hector/android/AgentTaskJournal.kt
          test -f app/src/test/java/com/hector/android/AgentTaskPolicyTest.kt
          test -f app/src/test/java/com/hector/android/AgentTaskVerifierTest.kt
          grep -q 'AgentTaskPolicy.validateTask(taskGoal)' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'AgentTaskPolicy.validatePlan(listOf(step))' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'AgentTaskPolicy.boundedOutput(toolResult.text)' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'AgentTaskVerifier.evaluate(' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'agentTaskJournal.record(' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'val maxRounds = 6' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'FirebaseInstallations.getInstance().id' app/src/main/java/com/hector/android/HectorFirebaseMessagingService.kt
          ! grep -Eq 'FirebaseMessaging\.getInstance\(\)\.register\(\)|override fun onRegistered' app/src/main/java/com/hector/android/MainActivity.kt app/src/main/java/com/hector/android/HectorFirebaseMessagingService.kt
          grep -q 'memory.size() <= 300000' firestore.rules
          grep -q 'history.size() <= 300000' firestore.rules
          grep -q 'MAX_FIELD_UTF8_BYTES' app/src/main/java/com/hector/android/CloudSyncPayloadLimits.kt
          grep -q 'isWithinLimits(localMemory, localHistory)' app/src/main/java/com/hector/android/CloudMemorySync.kt
          grep -q 'uri.encodedQuery == null' app/src/main/java/com/hector/android/LiveVoiceActivity.kt
          node --input-type=module --check < cloudflare-worker/src/index.js
          npm test --prefix cloudflare-worker
          grep -Fq 'request.headers.get("Authorization") !== `Bearer ${env.HECTOR_GATE_TOKEN}`' cloudflare-worker/src/index.js
          grep -Fq 'url.pathname === "/live/session"' cloudflare-worker/src/index.js
          grep -Fq 'url.pathname === "/chat"' cloudflare-worker/src/index.js

      - name: Create CI debug signing key required by project configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Run Android lint and JVM unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest

      - name: Build debug APK (no personal release key required)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee app-debug-signer.txt
          "$aapt" dump badging "$apk" | tee app-debug-metadata.txt
          grep -Fq "package: name='com.hector.android' versionCode='26' versionName='1.6.0-background-voice'" app-debug-metadata.txt
          grep -Fq "sdkVersion:'23'" app-debug-metadata.txt
          grep -Fq "targetSdkVersion:'36'" app-debug-metadata.txt
          "$aapt" dump permissions "$apk" | tee app-debug-permissions.txt
          if grep -Eqi 'USE_BIOMETRIC|USE_FINGERPRINT|permission.CAMERA' app-debug-permissions.txt; then
            echo "Unexpected biometric, camera, or Google-specific permission found in the debug APK."
            exit 1
          fi
          sha256sum "$apk" | tee app-debug.apk.sha256

      - name: Upload installable debug APK and verification files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Hector-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug-signer.txt
            app-debug-metadata.txt
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
