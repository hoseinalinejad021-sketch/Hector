name: Build Hector Debug APK (no release key required)

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "main"
      - "@Chat-GPT"
    paths:
      - ".gitignore"
      - "app/**"
      - "cloudflare-worker/**"
      - "docs/**"
      - "*.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-debug-apk.yml"
      - "firestore.rules"
      - "docs/ANDROID_CLOUD_SETUP_FA.md"

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require and validate Firebase Android resources
        shell: bash
        env:
          HECTOR_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.HECTOR_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${HECTOR_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "::error::HECTOR_GOOGLE_SERVICES_JSON_BASE64 is missing. This build requires Firebase configuration for cloud sync and push registration."
            exit 1
          fi
          printf '%s' "$HECTOR_GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/google-services.json")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Firebase google-services.json is not valid JSON: {exc}")

          project = data.get("project_info", {})
          if project.get("project_id") != "hector-9b819":
              raise SystemExit(
                  "Firebase config project_id mismatch; expected hector-9b819, "
                  f"got {project.get('project_id')!r}"
              )

          expected_app_id = "1:814329214529:android:6fb241cfa3849de815f8c0"
          matches = [
              client for client in data.get("client", [])
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.hector.android"
          ]
          if not matches:
              raise SystemExit(
                  "Firebase config does not contain Android package com.hector.android"
              )
          if not any(
              client.get("client_info", {}).get("mobilesdk_app_id") == expected_app_id
              for client in matches
          ):
              raise SystemExit(
                  "Firebase Android app ID mismatch; expected "
                  "1:814329214529:android:6fb241cfa3849de815f8c0"
              )

          print("Firebase config validated: project hector-9b819, app com.hector.android.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: "8.13"

      - name: Publish Build Overview
        shell: bash
        run: |
          {
            echo "## Hector Build Overview"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Runner | ubuntu-latest |"
            echo "| Java distribution/version | Eclipse Temurin 17 |"
            echo "| Gradle | 8.13 |"
            echo "| Android SDK platform | android-36 (API 36) |"
            echo "| Android Build Tools | 36.0.0 |"
            echo "| compileSdk / targetSdk | 36 / 36 |"
            echo "| minSdk | 23 |"
            echo "| Package ID | com.hector.android |"
            echo "| Build variant | debug |"
            echo "| APK output | app/build/outputs/apk/debug/app-debug.apk |"
            echo "| Artifact name | Hector-debug-APK |"
            echo "| Artifact retention | 14 days |"
            echo
            echo "SDK packages are installed by android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd."
            echo "This workflow creates a debug-signed APK; it is not an official release-signed build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required source files
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/CloudMemorySync.kt
          test -f app/src/main/java/com/hector/android/CloudSyncPayloadLimits.kt
          test -f app/src/main/java/com/hector/android/LiveVoiceActivity.kt
          test -f app/src/test/java/com/hector/android/CloudSyncPayloadLimitsTest.kt
          test -f app/src/main/java/com/hector/android/HectorFirebaseMessagingService.kt
          grep -q 'registerCurrentPushTokenForSignedInUser' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'request.auth.uid == userId' firestore.rules
          grep -q 'request.resource.data.installationId' firestore.rules
          grep -q 'memory.size() <= 300000' firestore.rules
          grep -q 'history.size() <= 300000' firestore.rules
          grep -q 'MAX_FIELD_UTF8_BYTES' app/src/main/java/com/hector/android/CloudSyncPayloadLimits.kt
          grep -q 'isWithinLimits(localMemory, localHistory)' app/src/main/java/com/hector/android/CloudMemorySync.kt
          grep -q 'uri.encodedQuery == null' app/src/main/java/com/hector/android/LiveVoiceActivity.kt
          node --input-type=module --check < cloudflare-worker/src/index.js
          npm test --prefix cloudflare-worker
          grep -Fq 'request.headers.get("Authorization") !== `Bearer ${env.HECTOR_GATE_TOKEN}`' cloudflare-worker/src/index.js
          grep -Fq 'url.pathname === "/live/session"' cloudflare-worker/src/index.js
          grep -Fq 'url.pathname === "/chat"' cloudflare-worker/src/index.js

      - name: Create CI debug signing key required by project configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Run Android lint and JVM unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest

      - name: Build debug APK (no personal release key required)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee app-debug-signer.txt
          "$aapt" dump badging "$apk" | tee app-debug-metadata.txt
          grep -Fq "package: name='com.hector.android' versionCode='26' versionName='1.6.0-background-voice'" app-debug-metadata.txt
          grep -Fq "sdkVersion:'23'" app-debug-metadata.txt
          grep -Fq "targetSdkVersion:'36'" app-debug-metadata.txt
          "$aapt" dump permissions "$apk" | tee app-debug-permissions.txt
          if grep -Eqi 'USE_BIOMETRIC|USE_FINGERPRINT|permission.CAMERA' app-debug-permissions.txt; then
            echo "Unexpected biometric, camera, or Google-specific permission found in the debug APK."
            exit 1
          fi
          sha256sum "$apk" | tee app-debug.apk.sha256

      - name: Upload installable debug APK and verification files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hector-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug-signer.txt
            app-debug-metadata.txt
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
