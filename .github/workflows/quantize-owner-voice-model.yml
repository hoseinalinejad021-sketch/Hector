name: Quantize and commit owner voice model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quantize-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/owner-face-voice-matching
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and verify original ECAPA-TDNN model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://huggingface.co/astrolabos/ecapa-tdnn/resolve/main/ecapa_tdnn.onnx" \
            --output /tmp/ecapa_tdnn.onnx
          echo "9acb086d5d9efca07266930ce03772f13cad5fd5a415bcf014ee4d82bed26311  /tmp/ecapa_tdnn.onnx" | sha256sum --check -

      - name: Quantize to INT8 and validate ONNX load
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnx onnxruntime
          python - <<'PY'
          from pathlib import Path
          import onnx
          from onnxruntime.quantization import quantize_dynamic, QuantType
          src = Path("/tmp/ecapa_tdnn.onnx")
          out = Path("app/src/main/assets/owner_voice/ecapa_tdnn_int8.onnx")
          out.parent.mkdir(parents=True, exist_ok=True)
          quantize_dynamic(str(src), str(out), weight_type=QuantType.QInt8)
          onnx.checker.check_model(str(out))
          import onnxruntime as ort
          session = ort.InferenceSession(str(out), providers=["CPUExecutionProvider"])
          print("Model inputs:", [(x.name, x.shape, x.type) for x in session.get_inputs()])
          print("Model outputs:", [(x.name, x.shape, x.type) for x in session.get_outputs()])
          print(f"Original bytes: {src.stat().st_size}")
          print(f"INT8 bytes: {out.stat().st_size}")
          if out.stat().st_size >= src.stat().st_size:
              raise SystemExit("Quantization did not reduce model size; refusing to commit.")
          PY

      - name: Commit the quantized binary to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/owner_voice/ecapa_tdnn_int8.onnx
          git commit -m "Add INT8 quantized owner voice model"
          git push origin HEAD:feature/owner-face-voice-matching
