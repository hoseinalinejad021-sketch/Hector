name: Refresh Hector daily knowledge

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/daily-knowledge.yml"
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public daily knowledge
        run: |
          python - <<'PY'
          import datetime, json, urllib.request, pathlib
          day = datetime.datetime.now(datetime.timezone.utc).date()
          url = f"https://en.wikipedia.org/api/rest_v1/feed/featured/{day:%Y/%m/%d}"
          req = urllib.request.Request(url, headers={"User-Agent": "HectorAndroid/0.5 (daily public knowledge index)"})
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)
          tfa = data.get("tfa") or {}
          mostread = (data.get("mostread") or {}).get("articles") or []
          news = data.get("news") or []
          items = []
          if tfa:
              items.append({
                  "kind": "featured",
                  "title": tfa.get("title", ""),
                  "summary": tfa.get("extract", ""),
                  "url": ((tfa.get("content_urls") or {}).get("desktop") or {}).get("page", "")
              })
          for article in mostread[:10]:
              items.append({
                  "kind": "most_read",
                  "title": article.get("title", ""),
                  "summary": article.get("extract", ""),
                  "url": ((article.get("content_urls") or {}).get("desktop") or {}).get("page", "")
              })
          for story in news[:5]:
              links = story.get("links") or []
              items.append({
                  "kind": "news",
                  "title": story.get("story", ""),
                  "summary": "",
                  "url": links[0].get("content_urls", {}).get("desktop", {}).get("page", "") if links else ""
              })
          payload = {
              "schema_version": 1,
              "updated_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "date_utc": day.isoformat(),
              "source": "Wikimedia/Wikipedia public featured feed",
              "notice": "Daily refreshed reference data; not a trained AI model and not guaranteed complete or error-free.",
              "items": items
          }
          path = pathlib.Path("knowledge/daily.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {len(items)} knowledge items to {path}")
          PY
      - name: Commit refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/daily.json
          if git diff --cached --quiet; then
            echo "Daily knowledge index unchanged."
          else
            git commit -m "Refresh daily public knowledge index"
            git push
          fi
