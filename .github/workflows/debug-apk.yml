name: Build Hector Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "@Chat-GPT"

permissions:
  contents: read

concurrency:
  group: hector-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4

      - name: Require and validate Firebase Android resources
        shell: bash
        env:
          HECTOR_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.HECTOR_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${HECTOR_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "::error::HECTOR_GOOGLE_SERVICES_JSON_BASE64 is missing; refusing to publish a debug APK without Firebase configuration."
            exit 1
          fi
          printf '%s' "$HECTOR_GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          try:
              data = json.loads(Path("app/google-services.json").read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Firebase config is not valid JSON: {exc}")

          if data.get("project_info", {}).get("project_id") != "hector-9b819":
              raise SystemExit("Firebase project_id mismatch; expected hector-9b819")
          expected_app_id = "1:814329214529:android:6fb241cfa3849de815f8c0"
          matches = [
              client for client in data.get("client", [])
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.hector.android"
          ]
          if not any(
              client.get("client_info", {}).get("mobilesdk_app_id") == expected_app_id
              for client in matches
          ):
              raise SystemExit("Firebase app ID/package mismatch for com.hector.android")
          print("Firebase config validated for Hector Android.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v4
        with:
          gradle-version: "8.13"

      - name: Create stable debug signing key if absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: Hector-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
