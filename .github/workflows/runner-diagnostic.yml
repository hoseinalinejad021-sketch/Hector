name: Hector Runner Diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/runner-diagnostic.yml"
permissions:
  contents: read
jobs:
  runner-smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Confirm runner starts
        run: |
          echo "RUNNER_STARTED"
          uname -a
          java -version || true
