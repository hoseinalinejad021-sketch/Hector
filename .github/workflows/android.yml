name: Build Hector Android APK

on:
  push:
    branches:
      - "main"
      - "@Chat-GPT"
    paths:
      - ".gitignore"
      - ".github/workflows/android.yml"
      - ".github/workflows/build-debug-apk.yml"
      - "app/**"
      - "cloudflare-worker/**"
      - "docs/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "README.md"
      - "firestore.rules"
      - "firebase.json"
  pull_request:
    branches:
      - "main"
      - "@Chat-GPT"
    paths:
      - ".gitignore"
      - ".github/workflows/android.yml"
      - ".github/workflows/build-debug-apk.yml"
      - "app/**"
      - "cloudflare-worker/**"
      - "docs/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "README.md"
      - "firestore.rules"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
      HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
      HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
      HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
      HECTOR_RELEASE_SIGNING_CONFIGURED: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 != '' && secrets.HECTOR_RELEASE_STORE_PASSWORD != '' && secrets.HECTOR_RELEASE_KEY_ALIAS != '' && secrets.HECTOR_RELEASE_KEY_PASSWORD != '' }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Require and validate Firebase Android resources
        shell: bash
        env:
          HECTOR_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.HECTOR_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${HECTOR_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "::error::HECTOR_GOOGLE_SERVICES_JSON_BASE64 is missing. This build requires Firebase configuration for cloud sync and push registration."
            exit 1
          fi
          printf '%s' "$HECTOR_GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/google-services.json")
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Firebase google-services.json is not valid JSON: {exc}")

          project = data.get("project_info", {})
          if project.get("project_id") != "hector-9b819":
              raise SystemExit(
                  "Firebase config project_id mismatch; expected hector-9b819, "
                  f"got {project.get('project_id')!r}"
              )

          expected_app_id = "1:814329214529:android:6fb241cfa3849de815f8c0"
          matches = [
              client for client in data.get("client", [])
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.hector.android"
          ]
          if not matches:
              raise SystemExit(
                  "Firebase config does not contain Android package com.hector.android"
              )
          if not any(
              client.get("client_info", {}).get("mobilesdk_app_id") == expected_app_id
              for client in matches
          ):
              raise SystemExit(
                  "Firebase Android app ID mismatch; expected "
                  "1:814329214529:android:6fb241cfa3849de815f8c0"
              )

          print("Firebase config validated: project hector-9b819, app com.hector.android.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Create CI debug signing key required by project configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: "8.13"

      - name: Verify project files
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/CodeStudioActivity.kt
          test -f app/src/main/java/com/hector/android/TerminalActivity.kt
          test -f app/src/androidTest/java/com/hector/android/HectorInstrumentedTest.kt
          grep -q '"\.CodeStudioActivity"' app/src/main/AndroidManifest.xml
          grep -q 'محیط کدنویسی و تولید کد با هوش مصنوعی' app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/SecureMemoryStore.kt
          test -f app/src/main/java/com/hector/android/CloudMemorySync.kt
          test -f app/src/main/java/com/hector/android/CloudSyncPayloadLimits.kt
          test -f app/src/main/java/com/hector/android/LiveVoiceActivity.kt
          test -f app/src/main/java/com/hector/android/LiveGatewayUrlValidator.kt
          test -f app/src/test/java/com/hector/android/LiveGatewayUrlValidatorTest.kt
          test -f app/src/test/java/com/hector/android/CloudSyncPayloadLimitsTest.kt
          test -f app/src/main/java/com/hector/android/HectorFirebaseMessagingService.kt
          test -f app/src/main/java/com/hector/android/HectorVoiceForegroundService.kt
          test -f firestore.rules
          grep -q 'request.auth.uid == userId' firestore.rules
          grep -q 'schemaVersion' firestore.rules
          grep -q 'request.resource.data.installationId' firestore.rules
          grep -q 'firebase_messaging_installation_id_enabled' app/src/main/AndroidManifest.xml
          grep -q 'FirebaseMessaging.getInstance().register()' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'override fun onRegistered(installationId: String)' app/src/main/java/com/hector/android/HectorFirebaseMessagingService.kt
          ! grep -Eq 'FirebaseMessaging\.getInstance\(\)\.(getToken|token)|override fun onNewToken' app/src/main/java/com/hector/android/MainActivity.kt app/src/main/java/com/hector/android/HectorFirebaseMessagingService.kt
          grep -q 'deviceId.matches' firestore.rules
          grep -q 'memory.size() <= 300000' firestore.rules
          grep -q 'history.size() <= 300000' firestore.rules
          grep -q 'MAX_FIELD_UTF8_BYTES' app/src/main/java/com/hector/android/CloudSyncPayloadLimits.kt
          grep -q 'isWithinLimits(localMemory, localHistory)' app/src/main/java/com/hector/android/CloudMemorySync.kt
          test -f docs/ANDROID_CLOUD_SETUP_FA.md
          test -f docs/SECURITY_GATE.md
          test -f docs/TERMUX_BRIDGE_FA.md
          test -f docs/ANDROID_INSTALL_RELEASE_CHECKLIST_FA.md
          test -f docs/ANDROID_PREINSTALL_GAP_AUDIT_FA.md
          test -f docs/PERSONAL_SIGNING_AND_PHONE_TEST_FA.md
          test -f legacy/voice_identity_prototype/README.md
          grep -q 'versionCode = 26' app/build.gradle.kts
          grep -q 'versionName = "1.6.0-background-voice"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          test ! -e app/src/main/java/com/hector/android/SpeakerModelEngine.kt
          test ! -e app/src/main/java/com/hector/android/VoiceIdentityFlow.kt

      - name: Verify security defaults
        shell: bash
        run: |
          set -euo pipefail
          manifest="app/src/main/AndroidManifest.xml"
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          memory="app/src/main/java/com/hector/android/SecureMemoryStore.kt"
          voice_service="app/src/main/java/com/hector/android/HectorVoiceForegroundService.kt"
          code_studio="app/src/main/java/com/hector/android/CodeStudioActivity.kt"
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android.permission.RECORD_AUDIO' "$manifest"
          grep -q 'android:name="android.hardware.microphone" android:required="false"' "$manifest"
          ! grep -q 'android.permission.USE_BIOMETRIC' "$manifest"
          ! grep -q 'android.permission.USE_FINGERPRINT' "$manifest"
          ! grep -q 'android.permission.CAMERA' "$manifest"
          ! grep -q 'com.google.android.gms.permission' "$manifest"
          ! grep -q 'com.google.android.providers.gsf.permission' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'FLAG_SECURE' "$activity"
          ! grep -q 'BiometricPrompt' "$activity"
          ! grep -q 'BIOMETRIC_STRONG' "$activity"
          ! grep -q 'FingerprintManager' "$activity"
          grep -q 'putBoolean("emergency_stop_engaged", desiredStop).commit()' "$activity"
          grep -q 'if (!persisted)' "$activity"
          grep -q 'توقف فعال نگه داشته شد' "$activity"
          grep -q 'getBoolean("emergency_stop_engaged", false)' "$activity"
          grep -q 'showHome()' "$activity"
          grep -q 'AndroidKeyStore' "$memory"
          grep -q 'AES/GCM/NoPadding' "$memory"
          grep -q 'HIC-STOP-01' "$activity"
          grep -q 'readSecureString("history")' "$activity"
          grep -q 'writeSecureString("api_key"' "$activity"
          grep -q 'HectorVoiceForegroundService' "$activity"
          grep -q 'android:name=".HectorVoiceForegroundService"' "$manifest"
          grep -q 'android:foregroundServiceType="microphone"' "$manifest"
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' "$manifest"
          grep -q 'RealtimeVoiceSession' "$voice_service"
          grep -q 'getSharedPreferences("hector_private", MODE_PRIVATE)' "$voice_service"
          grep -q 'emergency_stop_engaged' "$voice_service"
          grep -q 'MAX_FILE_BYTES' "$code_studio"
          terminal="app/src/main/java/com/hector/android/TerminalActivity.kt"
          ! grep -q '/system/bin/sh' "$terminal"
          grep -q 'TerminalCommandPolicy.parse' "$terminal"
          grep -q 'TerminalCommandPolicy.resolveWorkspacePath' "$terminal"
          grep -q 'allowedExternal' app/src/main/java/com/hector/android/TerminalCommandPolicy.kt
          test -f app/src/test/java/com/hector/android/TerminalCommandPolicyTest.kt
          grep -q 'emergency_stop_engaged' "$terminal"
          grep -q 'emergencyStopped' "$terminal"
          grep -q 'Thread.sleep(100)' "$terminal"
          grep -q 'تأیید و اجرا' "$terminal"
          grep -q '۱۲ ثانیه' "$terminal"
          ! grep -q 'BiometricPrompt' "$terminal"
          grep -q 'canonicalFile' "$code_studio"
          grep -q 'com.squareup.okhttp3:okhttp:4.12.0' app/build.gradle.kts
          ! grep -q 'startVoiceChallenge' "$activity"
          ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$manifest"
          grep -q 'ActivityResultContracts' "$activity"
          grep -q 'https://' "$activity"
          grep -q 'HectorFirebaseMessagingService' "$manifest"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$manifest"
          grep -q 'com.google.firebase:firebase-firestore' app/build.gradle.kts
          grep -q 'com.google.firebase:firebase-messaging' app/build.gradle.kts

      - name: Verify emergency-stop, WebView origin, and Worker auth boundaries
        shell: bash
        run: |
          set -euo pipefail
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          live_webview="app/src/main/java/com/hector/android/LiveVoiceActivity.kt"
          worker="cloudflare-worker/src/index.js"
          grep -q 'instanceFollowRedirects = false' "$activity"
          grep -q 'user-started microphone foreground service is independent' "$activity"
          grep -q 'parsedUrl.userInfo != null' "$activity"
          grep -q 'normalizedHttpsOrigin' "$live_webview"
          grep -q 'isAllowedOrigin(request.origin)' "$live_webview"
          grep -q 'allowFileAccess = false' "$live_webview"
          grep -q 'allowContentAccess = false' "$live_webview"
          grep -q 'uri.encodedQuery == null' "$live_webview"
          grep -q 'LiveGatewayUrlValidator.isValid(configuredUrl)' "$activity"
          grep -q 'ACTION_WEBVIEW_SESSION' "$activity"
          grep -q 'ACTION_STOP_LIVE_VOICE_BROADCAST' "$live_webview"
          grep -Fq 'window.hectorStop=stop' "$worker"
          grep -q 'HIC-STOP-01' "$live_webview"
          ! grep -q 'startsWith(url.substringBefore' "$live_webview"
          node --input-type=module --check < "$worker"
          npm test --prefix cloudflare-worker
          grep -Fq 'request.headers.get("Authorization") !== `Bearer ${env.HECTOR_GATE_TOKEN}`' "$worker"
          grep -Fq 'url.pathname === "/live/session"' "$worker"
          grep -Fq 'url.pathname === "/chat"' "$worker"

      - name: Require release secrets for manual release build
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/@Chat-GPT' }}
        env:
          HAS_KEYSTORE: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HAS_KEYSTORE" != "true" || "$HAS_STORE_PASSWORD" != "true" || "$HAS_KEY_ALIAS" != "true" || "$HAS_KEY_PASSWORD" != "true" ]]; then
            echo "::error::Release signing secrets are missing or empty. Add all four repository Actions secrets before running a manual release build."
            exit 1
          fi
          echo "All four release signing secrets are present (values are not displayed)."

      - name: Validate private release keystore and alias
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/@Chat-GPT' }}
        id: validate-release-signing
        shell: bash
        env:
          HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
          HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
          HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
          HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${HECTOR_RELEASE_KEYSTORE_BASE64:-}" || -z "${HECTOR_RELEASE_STORE_PASSWORD:-}" || -z "${HECTOR_RELEASE_KEY_ALIAS:-}" || -z "${HECTOR_RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "::warning::Release signing secrets are incomplete; signed release will be skipped while debug build and tests continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/hector-release.jks"
          normalized="$RUNNER_TEMP/hector-release.base64"
          printf '%s' "$HECTOR_RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' > "$normalized"
          if ! base64 --decode "$normalized" > "$keystore" 2>"$RUNNER_TEMP/base64-error.txt"; then
            echo "::error::HECTOR_RELEASE_KEYSTORE_BASE64 is invalid Base64. Re-encode the exact verified release keystore and update the GitHub Actions secret."
            exit 1
          fi
          if [ ! -s "$keystore" ]; then
            echo "::error::Decoded release keystore is empty; refusing to mark this workflow green."
            exit 1
          fi
          decoded_sha256="$(sha256sum "$keystore" | cut -d ' ' -f1)"
          echo "Decoded release keystore SHA-256: $decoded_sha256"
          if [ "$decoded_sha256" != "c18d679618bcb972d65f81326b26750aa56e3e65a789a85c5de827c03c69f3e9" ]; then
            echo "::error::Decoded keystore SHA-256 does not match the verified Hector release keystore. Update HECTOR_RELEASE_KEYSTORE_BASE64 with the correct keystore."
            exit 1
          fi
          echo "Decoded keystore SHA-256 matches the verified local Hector release keystore."
          if ! keytool -list -keystore "$keystore" -storepass "$HECTOR_RELEASE_STORE_PASSWORD" > "$RUNNER_TEMP/keystore-list.txt" 2>"$RUNNER_TEMP/store-password-error.txt"; then
            echo "::error::Release keystore cannot be opened with HECTOR_RELEASE_STORE_PASSWORD. Correct the repository secret."
            exit 1
          fi
          if ! keytool -list -v -keystore "$keystore" -storepass "$HECTOR_RELEASE_STORE_PASSWORD" -alias "$HECTOR_RELEASE_KEY_ALIAS" > release-key-info.txt 2>"$RUNNER_TEMP/alias-error.txt"; then
            echo "::error::HECTOR_RELEASE_KEY_ALIAS was not found in the validated keystore; expected alias hector-release."
            exit 1
          fi
          if ! grep -q 'Entry type: PrivateKeyEntry' release-key-info.txt; then
            echo "::error::Configured release alias is not a PrivateKeyEntry."
            exit 1
          fi
          # Import the selected private-key entry into a temporary store. This verifies
          # the private-key password now, without changing the original release keystore.
          validation_keystore="$RUNNER_TEMP/hector-key-password-validation.p12"
          if ! keytool -importkeystore -noprompt \
              -srckeystore "$keystore" -srcstoretype JKS \
              -srcstorepass "$HECTOR_RELEASE_STORE_PASSWORD" \
              -srcalias "$HECTOR_RELEASE_KEY_ALIAS" \
              -srckeypass "$HECTOR_RELEASE_KEY_PASSWORD" \
              -destkeystore "$validation_keystore" -deststoretype PKCS12 \
              -deststorepass "$HECTOR_RELEASE_STORE_PASSWORD" \
              -destkeypass "$HECTOR_RELEASE_STORE_PASSWORD" \
              > "$RUNNER_TEMP/key-password-validation.txt" 2>&1; then
            echo "::error::HECTOR_RELEASE_KEY_PASSWORD cannot unlock the selected private key. Correct the key-password secret."
            exit 1
          fi
          test -s "$validation_keystore"
          rm -f "$validation_keystore"
          echo "Private-key password validated without modifying the original release keystore."
          echo "release_signing_configured=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore hash, store password, alias, private-key entry, and private-key password verified."

      - name: Run Android Lint
        run: gradle --no-daemon lintDebug

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Compile Android instrumentation tests
        run: gradle --no-daemon assembleDebugAndroidTest

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 5G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Upload Android instrumentation test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        continue-on-error: true
        with:
          name: Hector-android-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify debug APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee debug-signer.txt
          "$aapt" dump badging "$apk" | tee debug-apk-metadata.txt
          grep -Fq "package: name='com.hector.android' versionCode='26' versionName='1.6.0-background-voice'" debug-apk-metadata.txt
          grep -Fq "sdkVersion:'23'" debug-apk-metadata.txt
          grep -Fq "targetSdkVersion:'36'" debug-apk-metadata.txt
          "$aapt" dump permissions "$apk" | tee debug-apk-permissions.txt
          if grep -Eqi 'USE_BIOMETRIC|USE_FINGERPRINT|permission.CAMERA' debug-apk-permissions.txt; then
            echo "Unexpected biometric, camera, or Google-specific permission found in the debug APK."
            exit 1
          fi
          sha256sum "$apk" | tee app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hector-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            debug-signer.txt
            debug-apk-metadata.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/@Chat-GPT' && steps.validate-release-signing.outputs.release_signing_configured == 'true' }}
        env:
          HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
          HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
          HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
          HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
          HECTOR_RELEASE_SIGNING_VALIDATED: "true"
        run: gradle --no-daemon assembleRelease

      - name: Verify signed release APK and installation metadata
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/@Chat-GPT' && steps.validate-release-signing.outputs.release_signing_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          test -x "$apksigner"
          test -x "$aapt"
          test -x "$zipalign"
          "$apksigner" verify --verbose --print-certs "$apk" | tee release-signer.txt
          "$zipalign" -c -v 4 "$apk" | tee release-zipalign.txt
          grep -q 'Signer #1 certificate DN:' release-signer.txt
          "$aapt" dump badging "$apk" | tee release-apk-metadata.txt
          grep -Fq "package: name='com.hector.android' versionCode='26' versionName='1.6.0-background-voice'" release-apk-metadata.txt
          grep -Fq "sdkVersion:'23'" release-apk-metadata.txt
          grep -Fq "targetSdkVersion:'36'" release-apk-metadata.txt
          "$aapt" dump permissions "$apk" | tee release-apk-permissions.txt
          grep -Fq "android.permission.INTERNET" release-apk-permissions.txt
          grep -Fq "android.permission.RECORD_AUDIO" release-apk-permissions.txt
          if grep -Eqi 'USE_BIOMETRIC|USE_FINGERPRINT|permission.CAMERA' release-apk-permissions.txt; then
            echo "Unexpected biometric, camera, or Google-specific permission found in the final APK."
            exit 1
          fi
          sha256sum "$apk" | tee app-release.apk.sha256

      - name: Upload signed release APK and verification files
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/@Chat-GPT' && steps.validate-release-signing.outputs.release_signing_configured == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hector-signed-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            release-signer.txt
            release-apk-metadata.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/@Chat-GPT' }}
    needs: build
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Download verified signed release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hector-signed-release-apk
          path: release-artifacts
      - name: Publish signed release APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: release-artifacts/app/build/outputs/apk/release/app-release.apk
          BUILD_TAG: hector-v1.6.0-release-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          test -s release-artifacts/app-release.apk.sha256
          test -s release-artifacts/release-signer.txt
          gh release create "$BUILD_TAG" "$APK_PATH" release-artifacts/app-release.apk.sha256 release-artifacts/release-signer.txt --title "Hector 1.6.0 signed release ${{ github.run_number }}" --notes "Signed release build from commit ${{ github.sha }}. Package: com.hector.android. Emergency stop key: HIC-STOP-01. APK signature and package metadata verified in CI. SHA-256 and signer certificate details are attached."
          asset_size="$(gh release view "$BUILD_TAG" --json assets --jq '.assets[] | select(.name == "app-release.apk") | .size')"
          test -n "$asset_size"
          echo "Verified signed release asset: app-release.apk ($asset_size bytes)"
