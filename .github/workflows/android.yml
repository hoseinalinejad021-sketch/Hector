name: Build Hector Android APK

on:
  push:
    branches:
      - "@Chat-GPT"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hector/android/MainActivity.kt
          test -f docs/SECURITY_GATE.md

      - name: Verify security defaults
        shell: bash
        run: |
          manifest="app/src/main/AndroidManifest.xml"
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          ! grep -q 'android.permission.RECORD_AUDIO' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'FLAG_SECURE' "$activity"
          grep -q 'BIOMETRIC_STRONG' "$activity"
          grep -q 'AndroidKeyStore' "$activity"
          grep -q 'BiometricPrompt.CryptoObject(cipher)' "$activity"
          grep -q 'doFinal' "$activity"
          grep -q 'pendingChallenge' "$activity"
          grep -q 'HIC-STOP-01' "$activity"
          grep -q 'voice' docs/SECURITY_GATE.md

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hector-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
