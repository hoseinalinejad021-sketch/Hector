name: Build Hector Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/SpeakerModelEngine.kt
          test -f app/src/main/java/com/hector/android/SecureMemoryStore.kt
          test -f docs/SECURITY_GATE.md

      - name: Verify security defaults
        shell: bash
        run: |
          manifest="app/src/main/AndroidManifest.xml"
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android.permission.RECORD_AUDIO' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'FLAG_SECURE' "$activity"
          grep -q 'BIOMETRIC_STRONG' "$activity"
          grep -q 'AndroidKeyStore' "$activity"
          grep -q 'BiometricPrompt.CryptoObject(cipher)' "$activity"
          grep -q 'doFinal' "$activity"
          grep -q 'pendingChallenge' "$activity"
          grep -q 'HIC-STOP-01' "$activity"
          grep -q 'voice' docs/SECURITY_GATE.md
          grep -q 'com.github.k2-fsa:sherpa-onnx:v1.13.8' app/build.gradle.kts
          grep -q 'SpeakerEmbeddingExtractor' app/src/main/java/com/hector/android/SpeakerModelEngine.kt
          grep -q 'AES/GCM/NoPadding' app/src/main/java/com/hector/android/SecureMemoryStore.kt
          grep -q 'AndroidKeyStore' app/src/main/java/com/hector/android/SecureMemoryStore.kt
          grep -q 'setRandomizedEncryptionRequired(true)' app/src/main/java/com/hector/android/SecureMemoryStore.kt
          grep -q 'initializeSpeakerModelEngine' app/src/main/java/com/hector/android/MainActivity.kt

      - name: Download speaker embedding model
        shell: bash
        run: |
          set -euo pipefail
          model_dir="app/src/main/assets"
          model_file="3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx"
          mkdir -p "$model_dir"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/$model_file" \
            --output "$model_dir/$model_file"
          test -s "$model_dir/$model_file"
          echo "Speaker model downloaded:"
          ls -lh "$model_dir/$model_file"
          sha256sum "$model_dir/$model_file"

      - name: Verify speaker model is packaged as an input asset
        shell: bash
        run: |
          test -s app/src/main/assets/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx
          grep -q 'speaker embedding model' docs/SECURITY_GATE.md

      - name: Cache Android debug signing key for update compatibility
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hector-android-debug-keystore-v1

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Hector-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
