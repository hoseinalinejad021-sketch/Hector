name: Build Hector Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Verify source and fail-closed defaults
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/AndroidManifest.xml
          test -f docs/SECURITY_GATE.md
          ! grep -R -E 'RECORD_AUDIO|AudioRecord|SpeakerModelEngine|VoiceIdentityFlow|sherpa-onnx' app/src/main app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'FLAG_SECURE' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'BIOMETRIC_STRONG' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'AndroidKeyStore' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'HIC-STOP-01' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'emergency_stop_engaged.*true' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'تطبیق چهره واقعی هنوز پیاده‌سازی نشده' docs/SECURITY_GATE.md
      - name: Cache Android debug signing key for update compatibility
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hector-android-debug-keystore-v1
      - name: Ensure stable Android debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --print-certs "$apk"
          sha256sum "$apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Hector-face-login-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
