name: Build Hector Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
      HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
      HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
      HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
      HECTOR_RELEASE_SIGNING_CONFIGURED: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 != '' && secrets.HECTOR_RELEASE_STORE_PASSWORD != '' && secrets.HECTOR_RELEASE_KEY_ALIAS != '' && secrets.HECTOR_RELEASE_KEY_PASSWORD != '' }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Verify project files
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/CodeStudioActivity.kt
          grep -q 'startActivity(Intent(this, CodeStudioActivity::class.java))' app/src/main/java/com/hector/android/MainActivity.kt
          grep -q 'private fun generateCode()' app/src/main/java/com/hector/android/CodeStudioActivity.kt
          grep -q 'emergency_stop_engaged' app/src/main/java/com/hector/android/CodeStudioActivity.kt
          grep -q 'instanceFollowRedirects = false' app/src/main/java/com/hector/android/CodeStudioActivity.kt
          test -f app/src/main/java/com/hector/android/SecureMemoryStore.kt
          test -f app/src/androidTest/java/com/hector/android/HectorInstrumentedTest.kt
          test -f docs/PRIVACY_POLICY_FA.md
          test -f docs/PLAY_STORE_LISTING_FA.md
          test -f CHANGELOG.md
          test -f CHANGELOG.md
          test -f docs/SECURITY_GATE.md
          test -f docs/ANDROID_INSTALL_RELEASE_CHECKLIST_FA.md
          test -f docs/ANDROID_PREINSTALL_GAP_AUDIT_FA.md
          test -f docs/PERSONAL_SIGNING_AND_PHONE_TEST_FA.md
          test -f legacy/voice_identity_prototype/README.md
          grep -q 'versionCode = 25' app/build.gradle.kts
          grep -q 'versionName = "1.5.1-stop-only"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          test ! -e app/src/main/java/com/hector/android/SpeakerModelEngine.kt
          test ! -e app/src/main/java/com/hector/android/VoiceIdentityFlow.kt

      - name: Verify security defaults
        shell: bash
        run: |
          set -euo pipefail
          manifest="app/src/main/AndroidManifest.xml"
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          memory="app/src/main/java/com/hector/android/SecureMemoryStore.kt"
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'FLAG_SECURE' "$activity"
          ! grep -q 'BiometricPrompt' "$activity"
          ! grep -q 'BIOMETRIC_STRONG' "$activity"
          ! grep -q 'FingerprintManager' "$activity"
          grep -q 'putBoolean("emergency_stop_engaged", stopNow)' "$activity"
          grep -q 'getBoolean("emergency_stop_engaged", false)' "$activity"
          grep -q 'showHome()' "$activity"
          grep -q 'AndroidKeyStore' "$memory"
          grep -q 'AES/GCM/NoPadding' "$memory"
          grep -q 'HIC-STOP-01' "$activity"
          grep -q 'readSecureString("history")' "$activity"
          grep -q 'writeSecureString("api_key"' "$activity"
          ! grep -q 'android.permission.USE_BIOMETRIC' "$manifest"
          ! grep -q 'android.permission.USE_FINGERPRINT' "$manifest"
          grep -q 'RealtimeVoiceSession' "$activity"
          grep -q 'com.squareup.okhttp3:okhttp:4.12.0' app/build.gradle.kts
          ! grep -q 'startVoiceChallenge' "$activity"
          ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$manifest"
          grep -q 'android.permission.RECORD_AUDIO' "$manifest"
          ! grep -q 'android.permission.CAMERA' "$manifest"
          grep -q 'ActivityResultContracts' "$activity"
          grep -q 'https://' "$activity"

      - name: Verify emergency-stop and network hardening
        shell: bash
        run: |
          set -euo pipefail
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          grep -q 'instanceFollowRedirects = false' "$activity"
          grep -q 'Backgrounding invalidates the session' "$activity"
          grep -q 'parsedUrl.userInfo != null' "$activity"

      - name: Cache Android debug signing key for update compatibility
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: hector-android-debug-keystore-v1

      - name: Ensure stable Android debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Verify and record debug signing certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee signing-certificate.txt
          grep -q 'SHA256:' signing-certificate.txt

      - name: Run Android Lint
        run: gradle --no-daemon lintDebug

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Upload Android instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hector-android-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug APK for CI diagnostics
        run: gradle --no-daemon assembleDebug

      - name: Verify debug APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --verbose "$apk"
          sha256sum "$apk" | tee apk-sha256.txt

      - name: Upload debug APK and verification records as CI artifact (not an official release)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Hector-debug-diagnostic
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-certificate.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish private diagnostic APK fallback
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/@Chat-GPT' && env.HECTOR_RELEASE_SIGNING_CONFIGURED != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
          BUILD_TAG: hector-v1.5.1-diagnostic-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          gh release create "$BUILD_TAG" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "Hector 1.5.1 diagnostic build ${{ github.run_number }}" \
            --notes "PRIVATE DIAGNOSTIC BUILD ONLY — not an official production release. Built from commit ${{ github.sha }}. Package: com.hector.android. Debug signing certificate; intended for installation testing only. Emergency stop key: HIC-STOP-01." \
            --prerelease
          asset_size="$(gh release view "$BUILD_TAG" --json assets --jq '.assets[] | select(.name == "app-debug.apk") | .size')"
          test -n "$asset_size"
          echo "Verified diagnostic release asset: app-debug.apk ($asset_size bytes)"

      - name: Build signed release APK
        if: ${{ env.HECTOR_RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
          HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
          HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
          HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signed release APK
        if: ${{ env.HECTOR_RELEASE_SIGNING_CONFIGURED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --verbose --print-certs "$apk" | tee release-signer.txt
          grep -q 'Signer #1 certificate DN:' release-signer.txt
          sha256sum "$apk"

      - name: Publish signed release APK
        if: ${{ github.event_name != 'pull_request' && env.HECTOR_RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          BUILD_TAG: hector-v1.5.1-release-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$BUILD_TAG" "$APK_PATH" \
            --title "Hector 1.5.1 signed release ${{ github.run_number }}" \
            --notes "Signed release build from commit ${{ github.sha }}. Package: com.hector.android. Emergency stop key: HIC-STOP-01. Signature verified in CI."
          asset_size="$(gh release view "$BUILD_TAG" --json assets --jq '.assets[] | select(.name == "app-release.apk") | .size')"
          test -n "$asset_size"
          echo "Verified signed release asset: app-release.apk ($asset_size bytes)"

      - name: Explain why signed release was skipped
        if: ${{ env.HECTOR_RELEASE_SIGNING_CONFIGURED != 'true' }}
        run: echo "Release signing secrets are not configured. Only a diagnostic debug APK was built; no debug APK is published as an official release."
