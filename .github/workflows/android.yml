name: Build Hector Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Fetch MobileFaceNet model asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          archive="$(mktemp)"
          curl --fail --location --retry 3 --output "$archive" "https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/mobile_facenet/releases/v0.64.0/mobile_facenet-tflite-float.zip"
          unzip -l "$archive"
          model_path="$(unzip -Z1 "$archive" | grep -E '(^|/)mobilefacenet\.tflite$|(^|/)mobile_facenet\.tflite$' | head -n1 || true)"
          if [ -z "$model_path" ]; then
            model_path="$(unzip -Z1 "$archive" | grep -E '\.tflite$' | head -n1 || true)"
          fi
          test -n "$model_path"
          unzip -p "$archive" "$model_path" > app/src/main/assets/mobilefacenet.tflite
          test -s app/src/main/assets/mobilefacenet.tflite
          sha256sum app/src/main/assets/mobilefacenet.tflite

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/assets/mobilefacenet.tflite
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/FaceLivenessChallengeController.kt
          test -f app/src/main/java/com/hector/android/OwnerVerificationGate.kt
          test -f app/src/main/java/com/hector/android/SecureMemoryStore.kt
          test -f docs/SECURITY_GATE.md
          test -f docs/INTEGRATION_INVENTORY_FA.md
          test -f legacy/voice_identity_prototype/README.md
          grep -q 'versionCode = 21' app/build.gradle.kts
          grep -q 'versionName = "1.4.7-face-enrollment-retry"' app/build.gradle.kts
          # The experimental voice-auth prototype must stay outside the APK until its model and anti-spoof checks are validated.
          test ! -e app/src/main/java/com/hector/android/SpeakerModelEngine.kt
          test ! -e app/src/main/java/com/hector/android/VoiceIdentityFlow.kt

      - name: Verify security defaults
        shell: bash
        run: |
          set -euo pipefail
          manifest="app/src/main/AndroidManifest.xml"
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          memory="app/src/main/java/com/hector/android/SecureMemoryStore.kt"
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'FLAG_SECURE' "$activity"
          grep -q 'BiometricPrompt' "$activity"
          grep -q 'AndroidKeyStore' "$memory"
          grep -q 'AES/GCM/NoPadding' "$memory"
          grep -q 'HIC-STOP-01' "$activity"
          grep -q 'readSecureString("history")' "$activity"
          grep -q 'writeSecureString("api_key"' "$activity"
          grep -q 'android.permission.USE_BIOMETRIC' "$manifest"
          grep -q 'android.permission.CAMERA' "$manifest"
          grep -q 'FaceLivenessChallengeController' "$activity"
          grep -q 'completeAuthentication()' "$activity"
          ! grep -q 'startVoiceChallenge' "$activity"
          grep -q 'com.google.mlkit:face-detection:16.1.7' app/build.gradle.kts
          grep -q 'org.tensorflow:tensorflow-lite:2.17.0' app/build.gradle.kts
          grep -q 'FaceIdentityEngine' "$activity"
          gate="app/src/main/java/com/hector/android/OwnerVerificationGate.kt"
          grep -q 'faceIdentityMatched: Boolean = false' "$gate"
          grep -q 'speakerIdentityMatched: Boolean = false' "$gate"
          grep -q 'voiceLivenessPassed: Boolean = false' "$gate"
          grep -q 'explicitActionConsent: Boolean = false' "$gate"
          grep -q 'fun allowsSensitiveOperation' "$gate"
          ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$manifest"
          ! grep -q 'android.permission.RECORD_AUDIO' "$manifest"
          grep -q 'ActivityResultContracts' "$activity"
          grep -q 'https://' "$activity"

      - name: Verify emergency-stop and network hardening
        shell: bash
        run: |
          set -euo pipefail
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          grep -q 'explicitStopResumeApproved' "$activity"
          grep -q 'توقف اضطراری فعال است' "$activity"
          grep -q 'instanceFollowRedirects = false' "$activity"
          grep -q 'Backgrounding invalidates the session' "$activity"
          grep -q 'parsedUrl.userInfo != null' "$activity"

      - name: Cache Android debug signing key for update compatibility
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hector-android-debug-keystore-v1

      - name: Ensure stable Android debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Verify and record signing certificate
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee signing-certificate.txt
          grep -q 'SHA256:' signing-certificate.txt

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK output and signing-key match
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner"
          key_sha="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          "$apksigner" verify --print-certs "$apk" | tee apk-signer-details.txt
          apk_sha="$(awk '/SHA-256 digest:/{gsub(":", "", $NF); print toupper($NF); exit}' apk-signer-details.txt)"
          echo "Cached signing key SHA256: $key_sha"
          echo "APK signer SHA256:          $apk_sha"
          test -n "$key_sha"
          test -n "$apk_sha"
          test "$key_sha" = "$apk_sha"
          sha256sum "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Hector-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
