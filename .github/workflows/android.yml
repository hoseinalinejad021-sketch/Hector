name: Build Hector Android APK

on:
  push:
    branches:
      - "main"
      - "@Chat-GPT"
    paths:
      - ".github/workflows/android.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "README.md"
  pull_request:
    branches:
      - "main"
      - "@Chat-GPT"
    paths:
      - ".github/workflows/android.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
      HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
      HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
      HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
      HECTOR_RELEASE_SIGNING_CONFIGURED: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 != '' && secrets.HECTOR_RELEASE_STORE_PASSWORD != '' && secrets.HECTOR_RELEASE_KEY_ALIAS != '' && secrets.HECTOR_RELEASE_KEY_PASSWORD != '' }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Create CI debug signing key required by project configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: "8.13"

      - name: Verify project files
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/CodeStudioActivity.kt
          test -f app/src/androidTest/java/com/hector/android/HectorInstrumentedTest.kt
          grep -q '"\.CodeStudioActivity"' app/src/main/AndroidManifest.xml
          grep -q 'محیط کدنویسی و تولید کد با هوش مصنوعی' app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/SecureMemoryStore.kt
          test -f app/src/main/java/com/hector/android/CloudMemorySync.kt
          test -f app/src/main/java/com/hector/android/HectorFirebaseMessagingService.kt
          test -f app/src/main/java/com/hector/android/HectorVoiceForegroundService.kt
          test -f firestore.rules
          test -f docs/ANDROID_CLOUD_SETUP_FA.md
          test -f docs/SECURITY_GATE.md
          test -f docs/ANDROID_INSTALL_RELEASE_CHECKLIST_FA.md
          test -f docs/ANDROID_PREINSTALL_GAP_AUDIT_FA.md
          test -f docs/PERSONAL_SIGNING_AND_PHONE_TEST_FA.md
          test -f legacy/voice_identity_prototype/README.md
          grep -q 'versionCode = 26' app/build.gradle.kts
          grep -q 'versionName = "1.6.0-background-voice"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          test ! -e app/src/main/java/com/hector/android/SpeakerModelEngine.kt
          test ! -e app/src/main/java/com/hector/android/VoiceIdentityFlow.kt

      - name: Verify security defaults
        shell: bash
        run: |
          set -euo pipefail
          manifest="app/src/main/AndroidManifest.xml"
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          memory="app/src/main/java/com/hector/android/SecureMemoryStore.kt"
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android.permission.RECORD_AUDIO' "$manifest"
          grep -q 'android:name="android.hardware.microphone" android:required="false"' "$manifest"
          ! grep -q 'android.permission.USE_BIOMETRIC' "$manifest"
          ! grep -q 'android.permission.USE_FINGERPRINT' "$manifest"
          ! grep -q 'android.permission.CAMERA' "$manifest"
          ! grep -q 'com.google.android.gms.permission' "$manifest"
          ! grep -q 'com.google.android.providers.gsf.permission' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'FLAG_SECURE' "$activity"
          ! grep -q 'BiometricPrompt' "$activity"
          ! grep -q 'BIOMETRIC_STRONG' "$activity"
          ! grep -q 'FingerprintManager' "$activity"
          grep -q 'putBoolean("emergency_stop_engaged", desiredStop).commit()' "$activity"
          grep -q 'if (!persisted)' "$activity"
          grep -q 'توقف فعال نگه داشته شد' "$activity"
          grep -q 'getBoolean("emergency_stop_engaged", false)' "$activity"
          grep -q 'showHome()' "$activity"
          grep -q 'AndroidKeyStore' "$memory"
          grep -q 'AES/GCM/NoPadding' "$memory"
          grep -q 'HIC-STOP-01' "$activity"
          grep -q 'readSecureString("history")' "$activity"
          grep -q 'writeSecureString("api_key"' "$activity"
          grep -q 'HectorVoiceForegroundService' "$activity"
          grep -q 'android:name=".HectorVoiceForegroundService"' "$manifest"
          grep -q 'android:foregroundServiceType="microphone"' "$manifest"
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' "$manifest"
          grep -q 'RealtimeVoiceSession' app/src/main/java/com/hector/android/HectorVoiceForegroundService.kt
          grep -q 'com.squareup.okhttp3:okhttp:4.12.0' app/build.gradle.kts
          ! grep -q 'startVoiceChallenge' "$activity"
          ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$manifest"
          grep -q 'ActivityResultContracts' "$activity"
          grep -q 'https://' "$activity"
          grep -q 'HectorFirebaseMessagingService' "$manifest"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$manifest"
          grep -q 'com.google.firebase:firebase-firestore' app/build.gradle.kts
          grep -q 'com.google.firebase:firebase-messaging' app/build.gradle.kts

      - name: Verify emergency-stop and network hardening
        shell: bash
        run: |
          set -euo pipefail
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          grep -q 'instanceFollowRedirects = false' "$activity"
          grep -q 'user-started microphone foreground service is independent' "$activity"
          grep -q 'parsedUrl.userInfo != null' "$activity"

      - name: Require release secrets for manual release build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          HAS_KEYSTORE: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HAS_KEYSTORE" != "true" || "$HAS_STORE_PASSWORD" != "true" || "$HAS_KEY_ALIAS" != "true" || "$HAS_KEY_PASSWORD" != "true" ]]; then
            echo "::error::Release signing secrets are missing or empty. Add all four repository Actions secrets before running a manual release build."
            exit 1
          fi
          echo "All four release signing secrets are present (values are not displayed)."

      - name: Validate private release keystore and alias
        id: validate-release-signing
        shell: bash
        env:
          HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
          HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
          HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
          HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${HECTOR_RELEASE_KEYSTORE_BASE64:-}" || -z "${HECTOR_RELEASE_STORE_PASSWORD:-}" || -z "${HECTOR_RELEASE_KEY_ALIAS:-}" || -z "${HECTOR_RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "::warning::Release signing secrets are incomplete; signed release will be skipped while debug build and tests continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/hector-release.jks"
          normalized="$RUNNER_TEMP/hector-release.base64"
          printf '%s' "$HECTOR_RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' > "$normalized"
          if ! base64 --decode "$normalized" > "$keystore" 2>"$RUNNER_TEMP/base64-error.txt"; then
            echo "::warning::Release signing disabled: HECTOR_RELEASE_KEYSTORE_BASE64 is invalid Base64. Debug APK and tests will continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s "$keystore" ]; then
            echo "::warning::Release signing disabled: decoded keystore is empty. Debug APK and tests will continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          decoded_sha256="$(sha256sum "$keystore" | cut -d ' ' -f1)"
          echo "Decoded release keystore SHA-256: $decoded_sha256"
          if [ "$decoded_sha256" != "c18d679618bcb972d65f81326b26750aa56e3e65a789a85c5de827c03c69f3e9" ]; then
            echo "::warning::Decoded keystore SHA-256 does not match the verified local Hector release keystore. Check HECTOR_RELEASE_KEYSTORE_BASE64."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Decoded keystore SHA-256 matches the verified local Hector release keystore."
          if ! keytool -list -keystore "$keystore" -storepass "$HECTOR_RELEASE_STORE_PASSWORD" > "$RUNNER_TEMP/keystore-list.txt" 2>"$RUNNER_TEMP/store-password-error.txt"; then
            echo "::warning::Release signing disabled: the decoded keystore cannot be opened with HECTOR_RELEASE_STORE_PASSWORD. Check the store password and confirm the Base64 secret belongs to this keystore. Debug APK and tests will continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! keytool -list -v -keystore "$keystore" -storepass "$HECTOR_RELEASE_STORE_PASSWORD" -alias "$HECTOR_RELEASE_KEY_ALIAS" > release-key-info.txt 2>"$RUNNER_TEMP/alias-error.txt"; then
            echo "::warning::Release signing disabled: the store password is valid, but HECTOR_RELEASE_KEY_ALIAS was not found in this keystore. Expected alias for the configured Hector key is hector-release. Debug APK and tests will continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q 'Entry type: PrivateKeyEntry' release-key-info.txt; then
            echo "::warning::Release signing disabled: configured alias is not a private-key entry. Debug APK and tests will continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release_signing_configured=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore decoded; store password and private-key alias verified. The key password is verified during assembleRelease signing."

      - name: Run Android Lint
        run: gradle --no-daemon lintDebug

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Compile Android instrumentation tests
        run: gradle --no-daemon assembleDebugAndroidTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: hector-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        if: ${{ steps.validate-release-signing.outputs.release_signing_configured == 'true' }}
        env:
          HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
          HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
          HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
          HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
          HECTOR_RELEASE_SIGNING_VALIDATED: "true"
        run: gradle --no-daemon assembleRelease

      - name: Verify signed release APK and installation metadata
        if: ${{ steps.validate-release-signing.outputs.release_signing_configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          test -x "$apksigner"
          test -x "$aapt"
          test -x "$zipalign"
          "$apksigner" verify --verbose --print-certs "$apk" | tee release-signer.txt
          "$zipalign" -c -v 4 "$apk" | tee release-zipalign.txt
          grep -q 'Signer #1 certificate DN:' release-signer.txt
          "$aapt" dump badging "$apk" | tee release-apk-metadata.txt
          grep -Fq "package: name='com.hector.android' versionCode='26' versionName='1.6.0-background-voice'" release-apk-metadata.txt
          grep -Fq "sdkVersion:'23'" release-apk-metadata.txt
          grep -Fq "targetSdkVersion:'36'" release-apk-metadata.txt
          "$aapt" dump permissions "$apk" | tee release-apk-permissions.txt
          grep -Fq "android.permission.INTERNET" release-apk-permissions.txt
          grep -Fq "android.permission.RECORD_AUDIO" release-apk-permissions.txt
          if grep -Eqi 'USE_BIOMETRIC|USE_FINGERPRINT|permission.CAMERA|com.google.android.gms.permission|com.google.android.providers.gsf.permission' release-apk-permissions.txt; then
            echo "Unexpected biometric, camera, or Google-specific permission found in the final APK."
            exit 1
          fi
          sha256sum "$apk" | tee app-release.apk.sha256

      - name: Upload signed release APK and verification files
        if: ${{ steps.validate-release-signing.outputs.release_signing_configured == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hector-signed-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            release-signer.txt
            release-apk-metadata.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed release APK
        if: ${{ github.event_name != 'pull_request' && steps.validate-release-signing.outputs.release_signing_configured == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          BUILD_TAG: hector-v1.5.1-release-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$BUILD_TAG" "$APK_PATH" app-release.apk.sha256 release-signer.txt --title "Hector 1.5.1 signed release ${{ github.run_number }}" --notes "Signed release build from commit ${{ github.sha }}. Package: com.hector.android. Emergency stop key: HIC-STOP-01. APK signature and package metadata verified in CI. SHA-256 and signer certificate details are attached."
          asset_size="$(gh release view "$BUILD_TAG" --json assets --jq '.assets[] | select(.name == "app-release.apk") | .size')"
          test -n "$asset_size"
          echo "Verified signed release asset: app-release.apk ($asset_size bytes)"
