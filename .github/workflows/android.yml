name: Build Hector Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Release publication is performed by this job, so write access is scoped here
    # instead of being granted workflow-wide. Keep this permission off future test-only jobs.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
      HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
      HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
      HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
      HECTOR_RELEASE_SIGNING_CONFIGURED: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 != '' && secrets.HECTOR_RELEASE_STORE_PASSWORD != '' && secrets.HECTOR_RELEASE_KEY_ALIAS != '' && secrets.HECTOR_RELEASE_KEY_PASSWORD != '' }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v4
        with:
          gradle-version: "8.11.1"

      - name: Verify project files
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hector/android/MainActivity.kt
          test -f app/src/main/java/com/hector/android/SecureMemoryStore.kt
          test -f app/src/main/java/com/hector/android/HectorVoiceForegroundService.kt
          test -f app/src/main/java/com/hector/android/CloudMemorySync.kt
          test -f app/src/main/java/com/hector/android/HectorFirebaseMessagingService.kt
          test -f firestore.rules
          test -f docs/SECURITY_GATE.md
          test -f docs/ANDROID_CLOUD_SETUP_FA.md
          test -f docs/ANDROID_INSTALL_RELEASE_CHECKLIST_FA.md
          test -f docs/ANDROID_PREINSTALL_GAP_AUDIT_FA.md
          test -f docs/PERSONAL_SIGNING_AND_PHONE_TEST_FA.md
          test -f legacy/voice_identity_prototype/README.md
          grep -q 'versionCode = 26' app/build.gradle.kts
          grep -q 'versionName = "1.6.0-background-voice"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          test ! -e app/src/main/java/com/hector/android/SpeakerModelEngine.kt
          test ! -e app/src/main/java/com/hector/android/VoiceIdentityFlow.kt

      - name: Verify security defaults
        shell: bash
        run: |
          set -euo pipefail
          manifest="app/src/main/AndroidManifest.xml"
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          memory="app/src/main/java/com/hector/android/SecureMemoryStore.kt"
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'FLAG_SECURE' "$activity"
          ! grep -q 'BiometricPrompt' "$activity"
          ! grep -q 'BIOMETRIC_STRONG' "$activity"
          ! grep -q 'FingerprintManager' "$activity"
          grep -q 'putBoolean("emergency_stop_engaged", desiredStop).commit()' "$activity"
          grep -q 'if (!persisted)' "$activity"
          grep -q 'توقف فعال نگه داشته شد' "$activity"
          grep -q 'getBoolean("emergency_stop_engaged", false)' "$activity"
          grep -q 'showHome()' "$activity"
          grep -q 'AndroidKeyStore' "$memory"
          grep -q 'AES/GCM/NoPadding' "$memory"
          grep -q 'HIC-STOP-01' "$activity"
          grep -q 'readSecureString("history")' "$activity"
          grep -q 'writeSecureString("api_key"' "$activity"
          ! grep -q 'android.permission.USE_BIOMETRIC' "$manifest"
          ! grep -q 'android.permission.USE_FINGERPRINT' "$manifest"
          grep -q 'HectorVoiceForegroundService' "$activity"
          grep -q 'RealtimeVoiceSession' app/src/main/java/com/hector/android/HectorVoiceForegroundService.kt
          grep -q 'com.squareup.okhttp3:okhttp:4.12.0' app/build.gradle.kts
          ! grep -q 'startVoiceChallenge' "$activity"
          ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$manifest"
          grep -q 'android.permission.RECORD_AUDIO' "$manifest"
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' "$manifest"
          grep -q 'android:foregroundServiceType="microphone"' "$manifest"
          grep -q 'HectorVoiceForegroundService' "$manifest"
          grep -q 'HectorFirebaseMessagingService' "$manifest"
          grep -q 'com.google.firebase:firebase-firestore' app/build.gradle.kts
          grep -q 'com.google.android.play:app-update' app/build.gradle.kts
          ! grep -q 'android.permission.CAMERA' "$manifest"
          grep -q 'ActivityResultContracts' "$activity"
          grep -q 'https://' "$activity"

      - name: Verify emergency-stop and network hardening
        shell: bash
        run: |
          set -euo pipefail
          activity="app/src/main/java/com/hector/android/MainActivity.kt"
          grep -q 'instanceFollowRedirects = false' "$activity"
          grep -q 'user-started microphone foreground service is independent' "$activity"
          grep -q 'parsedUrl.userInfo != null' "$activity"

      - name: Validate private release keystore and alias
        id: validate-release-signing
        shell: bash
        env:
          HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
          HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
          HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
          HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${HECTOR_RELEASE_KEYSTORE_BASE64:-}" || -z "${HECTOR_RELEASE_STORE_PASSWORD:-}" || -z "${HECTOR_RELEASE_KEY_ALIAS:-}" || -z "${HECTOR_RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "::warning::Release signing secrets are incomplete; signed release will be skipped while debug build and tests continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/hector-release.jks"
          normalized="$RUNNER_TEMP/hector-release.base64"
          printf '%s' "$HECTOR_RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' > "$normalized"
          if ! base64 --decode "$normalized" > "$keystore" 2>"$RUNNER_TEMP/base64-error.txt"; then
            echo "::warning::Release signing disabled: HECTOR_RELEASE_KEYSTORE_BASE64 is invalid Base64. Debug APK and tests will continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s "$keystore" ]; then
            echo "::warning::Release signing disabled: decoded keystore is empty. Debug APK and tests will continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          decoded_sha256="$(sha256sum "$keystore" | cut -d ' ' -f1)"
          echo "Decoded release keystore SHA-256: $decoded_sha256"
          if [ "$decoded_sha256" != "c18d679618bcb972d65f81326b26750aa56e3e65a789a85c5de827c03c69f3e9" ]; then
            echo "::warning::Decoded keystore SHA-256 does not match the verified local Hector release keystore. Check HECTOR_RELEASE_KEYSTORE_BASE64."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$HECTOR_RELEASE_STORE_PASSWORD" > "$RUNNER_TEMP/keystore-list.txt" 2>"$RUNNER_TEMP/store-password-error.txt"; then
            echo "::warning::Release signing disabled: the decoded keystore cannot be opened with HECTOR_RELEASE_STORE_PASSWORD. Debug APK and tests will continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! keytool -list -v -keystore "$keystore" -storepass "$HECTOR_RELEASE_STORE_PASSWORD" -alias "$HECTOR_RELEASE_KEY_ALIAS" > "$RUNNER_TEMP/release-key-info.txt" 2>"$RUNNER_TEMP/alias-error.txt"; then
            echo "::warning::Release signing disabled: HECTOR_RELEASE_KEY_ALIAS was not found in the verified keystore. Debug APK and tests will continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q 'Entry type: PrivateKeyEntry' "$RUNNER_TEMP/release-key-info.txt"; then
            echo "::warning::Release signing disabled: configured alias is not a private-key entry. Debug APK and tests will continue."
            echo "release_signing_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release_signing_configured=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore, SHA-256, store password, and private-key alias verified. The key password will be tested during assembleRelease."

      - name: Cache Android debug signing key for update compatibility
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.android/debug.keystore
          key: hector-android-debug-keystore-v1

      - name: Ensure stable Android debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Verify and record debug signing certificate
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee signing-certificate.txt
          grep -q 'SHA256:' signing-certificate.txt

      - name: Run Android Lint
        run: gradle --no-daemon lintDebug

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK for CI diagnostics
        run: gradle --no-daemon assembleDebug

      - name: Verify debug APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --verbose "$apk"
          sha256sum "$apk" | tee apk-sha256.txt

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Use the lighter API 30 image for software-emulated hosted runners without KVM.
          # This smoke test checks install/launch; compileSdk/targetSdk remain 36.
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/validate-emulator.sh

      - name: Upload debug APK and verification records as CI artifact (not an official release)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        continue-on-error: true
        with:
          name: Hector-debug-diagnostic
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            signing-certificate.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish private diagnostic APK fallback
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/@Chat-GPT' && steps.validate-release-signing.outputs.release_signing_configured != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
          BUILD_TAG: hector-v1.6.0-background-voice-diagnostic-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          gh release create "$BUILD_TAG" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "Hector 1.6.0 background voice diagnostic build ${{ github.run_number }}" \
            --notes "PRIVATE DIAGNOSTIC BUILD ONLY — not an official production release. Built from commit ${{ github.sha }}. Package: com.hector.android. Debug signing certificate; intended for installation testing only. Emergency stop key: HIC-STOP-01." \
            --prerelease
          asset_size="$(gh release view "$BUILD_TAG" --json assets --jq '.assets[] | select(.name == "app-debug.apk") | .size')"
          test -n "$asset_size"
          echo "Verified diagnostic release asset: app-debug.apk ($asset_size bytes)"

      - name: Build signed release APK
        id: assemble-release
        if: ${{ steps.validate-release-signing.outputs.release_signing_configured == 'true' }}
        continue-on-error: true
        env:
          HECTOR_RELEASE_SIGNING_VALIDATED: ${{ steps.validate-release-signing.outputs.release_signing_configured }}
          HECTOR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HECTOR_RELEASE_KEYSTORE_BASE64 }}
          HECTOR_RELEASE_STORE_PASSWORD: ${{ secrets.HECTOR_RELEASE_STORE_PASSWORD }}
          HECTOR_RELEASE_KEY_ALIAS: ${{ secrets.HECTOR_RELEASE_KEY_ALIAS }}
          HECTOR_RELEASE_KEY_PASSWORD: ${{ secrets.HECTOR_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signed release APK, package metadata, and permissions
        if: ${{ steps.validate-release-signing.outputs.release_signing_configured == 'true' && steps.assemble-release.outcome == 'success' }}
        id: verify-release
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          zipalign="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)"
          test -x "$apksigner"
          test -x "$aapt"
          test -x "$zipalign"
          "$apksigner" verify --verbose --print-certs "$apk" | tee release-signer.txt
          grep -q 'Signer #1 certificate DN:' release-signer.txt
          "$zipalign" -c -v 4 "$apk" | tee release-zipalign.txt
          "$aapt" dump badging "$apk" | tee release-apk-metadata.txt
          grep -Fq "package: name='com.hector.android' versionCode='26' versionName='1.6.0-background-voice'" release-apk-metadata.txt
          grep -Fq "sdkVersion:'23'" release-apk-metadata.txt
          grep -Fq "targetSdkVersion:'36'" release-apk-metadata.txt
          "$aapt" dump permissions "$apk" | tee release-apk-permissions.txt
          grep -Fq "android.permission.INTERNET" release-apk-permissions.txt
          grep -Fq "android.permission.RECORD_AUDIO" release-apk-permissions.txt
          grep -Fq "android.permission.FOREGROUND_SERVICE_MICROPHONE" release-apk-permissions.txt
          if grep -Eqi 'USE_BIOMETRIC|USE_FINGERPRINT|permission.CAMERA' release-apk-permissions.txt; then
            echo "Unexpected biometric or camera permission found in the final APK."
            exit 1
          fi
          sha256sum "$apk" | tee app-release.apk.sha256

      - name: Publish signed release APK
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/@Chat-GPT' && steps.validate-release-signing.outputs.release_signing_configured == 'true' && steps.assemble-release.outcome == 'success' && steps.verify-release.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          BUILD_TAG: hector-v1.6.0-background-voice-release-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$BUILD_TAG" "$APK_PATH" \
            --title "Hector 1.6.0 background voice signed release ${{ github.run_number }}" \
            --notes "Signed release build from commit ${{ github.sha }}. Package: com.hector.android. Emergency stop key: HIC-STOP-01. Signature verified in CI."
          asset_size="$(gh release view "$BUILD_TAG" --json assets --jq '.assets[] | select(.name == "app-release.apk") | .size')"
          test -n "$asset_size"
          echo "Verified signed release asset: app-release.apk ($asset_size bytes)"

      - name: Explain why signed release was skipped
        if: ${{ steps.validate-release-signing.outputs.release_signing_configured != 'true' || steps.assemble-release.outcome == 'failure' }}
        run: echo "Signed release was skipped or failed validation. Inspect the release-signing validation/build logs. Any debug APK from this run is diagnostic only, not an official release."
