name: Deploy Hector Paper Worker

on:
  workflow_dispatch:
    inputs:
      confirm_paper_only:
        description: "Confirm this deploy is paper-trading only; no real exchange orders"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hector-paper-worker-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: ${{ inputs.confirm_paper_only == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run Worker unit tests
        run: npm test
      - name: Deploy Worker to Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
