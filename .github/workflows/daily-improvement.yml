name: Hector Daily Improvement Check

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - "@Chat-GPT"
    paths:
      - ".github/workflows/daily-improvement.yml"
      - ".github/workflows/android.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - "tools/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: hector-daily-improvement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Daily quality and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Create CI debug signing key required by project configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Set up Gradle from the checked-in Wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Run read-only safety audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/daily_improvement_audit.py

      - name: Run unit tests, lint, and debug assembly
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hector-daily-check-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
            app/build/test-results/
            app/build/outputs/apk/debug/
            artifacts/daily-improvement-report.md
