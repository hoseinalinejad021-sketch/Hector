name: Build Hector Job Tracker APK

on:
  push:
    branches:
      - expo/job-tracker-companion
    paths:
      - 'expo-companion/**'
      - '.github/workflows/expo-companion-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-companion
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: expo-companion/package.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Check Expo project
        run: npx expo-doctor

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hector-Job-Tracker-debug-APK
          path: expo-companion/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
